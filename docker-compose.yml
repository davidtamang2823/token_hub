services:
  token_hub_db:
    image: postgres:17-bookworm
    container_name: token_hub_db
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - token_hub_postgres_data:/var/lib/postgresql/data
    networks:
      - token_hub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  token_hub_redis:
    image: redis:8-bookworm
    container_name: token_hub_redis
    ports:
      - "6379:6379"
    env_file:
      - .env.redis
    volumes:
      - token_hub_redis_data:/data
    networks:
      - token_hub_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always

  token_hub_app:
    build: .
    image: token_hub_app:latest
    container_name: token_hub_app
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/tokenhub
    env_file:
      - .env
    networks:
      - token_hub_network
    depends_on:
      token_hub_db:
        condition: service_healthy
      token_hub_redis:
        condition: service_healthy
    command: ["sh", "entrypoint.sh"]
    restart: always

  token_hub_worker:
    build: .
    image: token_hub_app:latest
    container_name: token_hub_worker
    volumes:
      - .:/usr/tokenhub
    env_file:
      - .env
    networks:
      - token_hub_network
    depends_on:
      token_hub_db:
        condition: service_healthy
      token_hub_redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]
    restart: always

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"  # web UI, viewable from host
    expose:
      - "1025"       # SMTP, internal only — worker/app reach it via docker network
    networks:
      - token_hub_network
    restart: always

networks:
  token_hub_network:
    external: true

volumes:
  token_hub_postgres_data:
    external: true
  token_hub_redis_data:
    external: true